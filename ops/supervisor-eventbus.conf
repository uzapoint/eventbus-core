; EventBus programs shared by every service. Included from the service's supervisord.conf:
;
;   [include]
;   files = /var/www/html/%(ENV_SERVICE_NAME)s/vendor/uzapoint/eventbus-core/ops/supervisor-eventbus.conf
;
; Needs the SERVICE_NAME environment variable (the app folder under /var/www/html), the same one
; the service's other programs already use.

[program:eventbus]
command=php /var/www/html/%(ENV_SERVICE_NAME)s/artisan eventbus:consume --quiet
process_name=%(program_name)s_%(process_num)02d
numprocs=2
priority=30
autostart=true
autorestart=true
startsecs=0
startretries=3
redirect_stderr=true
stdout_logfile=/var/www/html/%(ENV_SERVICE_NAME)s/storage/logs/eventbus.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopsignal=SIGTERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
environment=EVENTBUS_LIVENESS_DIR="/var/www/html/%(ENV_SERVICE_NAME)s/storage/framework/eventbus"

; Restarts a consumer whose liveness file stops being touched (a handler or socket that hangs
; forever). Runs through `sh`, so the file needs no executable bit.
[program:eventbus-watchdog]
command=sh /var/www/html/%(ENV_SERVICE_NAME)s/vendor/uzapoint/eventbus-core/ops/eventbus-watchdog.sh
priority=40
autostart=true
autorestart=true
startsecs=0
startretries=3
redirect_stderr=true
stdout_logfile=/var/www/html/%(ENV_SERVICE_NAME)s/storage/logs/eventbus-watchdog.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stopsignal=TERM
environment=EVENTBUS_LIVENESS_DIR="/var/www/html/%(ENV_SERVICE_NAME)s/storage/framework/eventbus",STALE_AFTER="120"
